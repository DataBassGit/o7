cog:
  name: o7
  description: "Cog implementation of o7"
  response_format: yaml

  agents:
    - id: thought
      template_file: ThoughtAgent

    - id: theory
      template_file: TheoryAgent

    - id: reason
      template_file: ThoughtProcessAgent

    - id: reflect
      template_file: ReflectAgent

    - id: generate
      template_file: GenerateAgent

  memory:
    - id: general
      # If no 'type' is defined, default to a base Memory class
      query_before: [theory, reflect]
      update_after: generate
      query_keys: thought.thoughts
      update_keys:
        - question
        - generate.final_response

  flow:
    start: thought
    transitions:
      thought: theory
      theory: reason
      reason: reflect
      reflect:
        choice:
          approve: generate
          revise: reason
          reject: reason
          default: generate
        max: 3
      generate:
        end: true
