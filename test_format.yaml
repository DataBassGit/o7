- "question": |-
    Consider a flat universe dominated by both matter (Ωₘ) and dark energy (Λ, Ω_Λ), with Ωₘ + Ω_Λ = 1. Using the Friedmann equation, derive the redshift z_eq at which the energy densities of matter and dark energy are equal. Assume the dark energy density is constant (cosmological constant) and the matter density scales as ρₘ ∝ (1+z)^3.
  "proof": |-
    To find z_eq, we equate the energy densities of matter and dark energy at redshift z_eq.

    1. Matter density scaling: ρₘ(z) = ρₘ₀ (1+z)^3, where ρₘ₀ is the present matter density.

    2. Dark energy density: ρ_Λ is constant (cosmological constant), so ρ_Λ(z) = ρ_Λ₀.

    3. At the equality redshift z_eq: ρₘ(z_eq) = ρ_Λ(z_eq). Substituting:
         ρₘ₀ (1+z_eq)^3 = ρ_Λ₀

    4. Divide both sides by the critical density ρ_c (present-day):
         Ωₘ (1+z_eq)^3 = Ω_Λ

    5. Since Ωₘ + Ω_Λ = 1, substitute Ω_Λ = 1 - Ωₘ:
         Ωₘ (1+z_eq)^3 = 1 - Ωₘ

    6. Solve for (1+z_eq)^3:
         (1+z_eq)^3 = (1 - Ωₘ) / Ωₘ

    7. Take the cube root and subtract 1 to isolate z_eq:
         z_eq = [(1 - Ωₘ)/Ωₘ]^(1/3) - 1
  "answer": |-
    The equality redshift is z_eq = [(1 - Ωₘ)/Ωₘ]^(1/3) - 1.
- "question": |-
    In a spatially flat universe dominated by matter (Ωₘ) and radiation (Ωᵣ), derive the redshift \( z_{eq} \) at which the energy densities of matter and radiation were equal. Assume the matter density scales as \( \rho_m \propto (1+z)^3 \) and the radiation density as \( \rho_r \propto (1+z)^4 \). Express your answer in terms of the present-day density parameters Ωₘ and Ωᵣ.
  "proof": |-
    To find \( z_{eq} \), we equate the energy densities of matter and radiation at that redshift:
    \[
    \rho_m(z_{eq}) = \rho_r(z_{eq}).
    \]
    Using the scaling relations:
    \[
    \rho_m(z) = \rho_{m,0} (1+z)^3, \quad \rho_r(z) = \rho_{r,0} (1+z)^4,
    \]
    where \( \rho_{m,0} \) and \( \rho_{r,0} \) are the present-day densities. Equating them at \( z = z_{eq} \):
    \[
    \rho_{m,0} (1+z_{eq})^3 = \rho_{r,0} (1+z_{eq})^4.
    \]
    Simplifying:
    \[
    \frac{\rho_{m,0}}{\rho_{r,0}} = 1 + z_{eq}.
    \]
    The present-day density parameters are defined as:
    \[
    \Omega_m = \frac{\rho_{m,0}}{\rho_{crit,0}}, \quad \Omega_r = \frac{\rho_{r,0}}{\rho_{crit,0}},
    \]
    where \( \rho_{crit,0} \) is the critical density today. Thus:
    \[
    \frac{\rho_{m,0}}{\rho_{r,0}} = \frac{\Omega_m}{\Omega_r}.
    \]
    Substituting back:
    \[
    1 + z_{eq} = \frac{\Omega_m}{\Omega_r}.
    \]
    Solving for \( z_{eq} \):
    \[
    z_{eq} = \frac{\Omega_m}{\Omega_r} - 1.
    \]
  "answer": |-
    The redshift at which matter and radiation energy densities were equal is \( z_{eq} = \frac{\Omega_m}{\Omega_r} - 1 \).
- "question": |-
    In a spatially flat universe with matter (Ωₘ), radiation (Ωᵣ), and curvature (Ωₖ = 0), the Hubble parameter \( H(z) \) is given by the Friedmann equation. Derive the redshift \( z_{acc} \) at which the universe transitions from decelerating to accelerating expansion, assuming a cosmological constant (Ω_Λ) dominates dark energy. Express your answer in terms of Ωₘ and Ω_Λ, noting that Ωₘ + Ω_Λ = 1 and radiation is negligible at late times.
  "proof": |-
    To find \( z_{acc} \), we start with the Friedmann equation for a flat universe:
    \[
    H^2(z) = H_0^2 \left[ \Omega_m (1+z)^3 + \Omega_\Lambda \right].
    \]
    The acceleration condition is derived from the second Friedmann equation:
    \[
    \frac{\ddot{a}}{a} = -\frac{4\pi G}{3} (\rho + 3p) + \frac{\Lambda c^2}{3},
    \]
    where \(\rho = \rho_m + \rho_\Lambda\) and \( p = p_m + p_\Lambda \). For matter (\( p_m = 0 \)) and cosmological constant (\( p_\Lambda = -\rho_\Lambda \)), this simplifies to:
    \[
    \frac{\ddot{a}}{a} = -\frac{4\pi G}{3} \rho_m + \frac{\Lambda c^2}{3}.
    \]
    The transition occurs when \(\ddot{a} = 0\):
    \[
    0 = -\frac{4\pi G}{3} \rho_m(z_{acc}) + \frac{\Lambda c^2}{3}.
    \]
    Substituting \(\rho_m(z) = \rho_{m,0} (1+z)^3\) and \(\Lambda c^2 = 8\pi G \rho_\Lambda\) (from \(\Omega_\Lambda = \frac{\Lambda c^2}{3H_0^2}\)), we get:
    \[
    4\pi G \rho_{m,0} (1+z_{acc})^3 = 8\pi G \rho_\Lambda.
    \]
    Using \(\rho_{m,0} = \frac{3H_0^2}{8\pi G} \Omega_m\) and \(\rho_\Lambda = \frac{3H_0^2}{8\pi G} \Omega_\Lambda\), this reduces to:
    \[
    \Omega_m (1+z_{acc})^3 = 2 \Omega_\Lambda.
    \]
    Solving for \( z_{acc} \):
    \[
    z_{acc} = \left( \frac{2 \Omega_\Lambda}{\Omega_m} \right)^{1/3} - 1.
    \]
  "answer": |-
    The redshift at which the universe transitions to accelerating expansion is \( z_{acc} = \left( \frac{2 \Omega_\Lambda}{\Omega_m} \right)^{1/3} - 1 \).
- "question": |-
    In a flat universe with matter (Ωₘ), radiation (Ωᵣ), and dark energy (Ω_Λ), where Ωₘ + Ωᵣ + Ω_Λ = 1, derive the redshift \( z_{r\Lambda} \) at which the energy densities of radiation and dark energy are equal. Assume the radiation density scales as \( \rho_r \propto (1+z)^4 \), the matter density as \( \rho_m \propto (1+z)^3 \), and the dark energy density is constant (cosmological constant). Express your answer in terms of the present-day density parameters Ωᵣ and Ω_Λ.
  "proof": "To find \\( z_{r\\Lambda} \\), we equate the energy densities of radiation\
    \ and dark energy at redshift \\( z \\):\n\\[\n\\rho_r(z) = \\rho_\\Lambda(z).\n\
    \\]\nThe present-day radiation density is \\( \\rho_{r,0} = \\rho_{crit,0} \\\
    Omega_r \\), where \\( \\rho_{crit,0} \\) is the critical density today. Similarly,\
    \ the dark energy density is constant: \\( \\rho_\\Lambda = \\rho_{crit,0} \\\
    Omega_\\Lambda \\).  \nThe radiation density at redshift \\( z \\) is:\n\\[\n\\\
    rho_r(z) = \\rho_{r,0} (1+z)^4 = \\rho_{crit,0} \\Omega_r (1+z)^4.\n\\]\nEquating\
    \ \\( \\rho_r(z) \\) and \\( \\rho_\\Lambda \\):\n\\[\n\\rho_{crit,0} \\Omega_r\
    \ (1+z)^4 = \\rho_{crit,0} \\Omega_\\Lambda.\n\\]\nSimplifying and solving for\
    \ \\( z \\):\n\\[\n(1+z)^4 = \\frac{\\Omega_\\Lambda}{\\Omega_r}, \\quad \\implies\
    \ \\quad 1+z = \\left( \\frac{\\Omega_\\Lambda}{\\Omega_r} \\right)^{1/4}.\n\\\
    ]\nThus, the redshift \\( z_{r\\Lambda} \\) is:\n\\[\nz_{r\\Lambda} = \\left(\
    \ \\frac{\\Omega_\\Lambda}{\\Omega_r} \\right)^{1/4} - 1.\n\\]"
  "answer": |-
    The redshift at which radiation and dark energy densities are equal is:
    \[
    z_{r\Lambda} = \left( \frac{\Omega_\Lambda}{\Omega_r} \right)^{1/4} - 1.
    \]
